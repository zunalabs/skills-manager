name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag, package, and release notes agree
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const pkg = require('./apps/desktop/package.json')
          const tag = process.env.GITHUB_REF_NAME
          const notes = fs.readFileSync('RELEASE_NOTES.md', 'utf8')
          if (tag !== `v${pkg.version}`) throw new Error(`Tag ${tag} does not match package version ${pkg.version}`)
          if (!notes.includes(`## ${pkg.version}`)) throw new Error(`RELEASE_NOTES.md has no ${pkg.version} heading`)
          NODE

  build-windows:
    needs: validate-version
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build --workspace apps/desktop

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: win-build
          path: apps/desktop/release/*.exe

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build --workspace apps/desktop

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: win-build
          path: dist/win

      - name: Download Linux build
        uses: actions/download-artifact@v8
        with:
          name: linux-build
          path: dist/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/win/*.exe
            dist/linux/*.AppImage
            dist/linux/*.deb
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
